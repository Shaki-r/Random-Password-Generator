
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E🔐%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1>Password Generator</h1>

        <div class="password-box">
            <input
                type="text"
                id="password"
                placeholder="Your password"
                readonly
            >

            <button id="copy" title="Copy password">📋</button>
        </div>

        <div class="strength-container">
            <div id="strengthBar"></div>
        </div>

        <p id="strengthText">No Password</p>

        <label for="length">Password Length</label>

        <input
            type="range"
            id="length"
            value="12"
            min="1"
            max="50"
        >

        <span id="lengthValue">12</span>

        <div class="options">

            <label>
                <input type="checkbox" id="uppercase" >
                Uppercase (A-Z)
            </label>

            <label>
                <input type="checkbox" id="lowercase" >
                Lowercase (a-z)
            </label>

            <label>
                <input type="checkbox" id="numbers">
                Numbers (0-9)
            </label>

            <label>
                <input type="checkbox" id="symbols">
                Symbols (!@#$)
            </label>

        </div>

        <button id="generate">Generate Password</button>

        <footer>
            <p>Made with ❤️ by Muhammad Shakir</p>

            <div class="social-links">

                <a href="https://github.com/Shaki-r"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.linkedin.com/in/shakir-afridi-356721404/"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

            </div>
        </footer>

    </div>

    <script src="app.js"></script>

</body>
</html>
